<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Savings Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        h1 { color: #24292e; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="date"], input[type="number"] {
            width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
        }
        button {
            background-color: #2ea44f; color: white; border: 1px solid rgba(27,31,35,.15);
            padding: 8px 16px; font-size: 14px; font-weight: 500; border-radius: 6px; cursor: pointer;
        }
        button:hover { background-color: #2c974b; }
        button:disabled { background-color: #94d3a2; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f6f8fa; }
        .positive { color: #2ea44f; font-weight: bold; }
        .negative { color: #cf222e; font-weight: bold; }
        .loading { color: #666; font-style: italic; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>💰 Cloud Savings Tracker (Synced)</h1>
    
    <form id="savingsForm">
        <div class="form-group">
            <label for="date">Monday Date:</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="amount">Total Savings Balance (\$):</label>
            <input type="number" id="amount" step="0.01" required placeholder="e.g. 5000">
        </div>
        <button type="submit" id="submitBtn">Log to Cloud</button>
        <span id="statusMessage" class="loading" style="display:none;">Saving...</span>
    </form>

    <div id="loadingData" class="loading">Fetching data from Google Sheets...</div>

    <table id="trackerTable" style="display:none;">
        <thead>
            <tr>
                <th>Date</th>
                <th>Total Savings</th>
                <th>Weekly Change</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        // ================= CONFIGURATION =================
        const SHEETDB_API_URL = 'https://sheetdb.io/api/v1/fmy1egbdam2h8'; // 填入你的 SheetDB API URL
        const SPREADSHEET_ID = 'https://docs.google.com/spreadsheets/d/1sg54mI7F77OUI6r5emf7Chey7KXZ93XNOQZTxo0hu4M/edit#gid=0';   // 填入你的 Google Spreadsheet ID
        const SHEET_NAME = 'Sheet1';                    // 你的工作表名称
        // =================================================

        document.getElementById('date').valueAsDate = new Date();
        const form = document.getElementById('savingsForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        const tableBody = document.getElementById('tableBody');
        const trackerTable = document.getElementById('trackerTable');
        const loadingData = document.getElementById('loadingData');

        // 从 Google Sheets 读取数据 (使用公共可读的 JSON 格式加速)
        async function fetchCloudData() {
            try {
                const url = `{SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
                const response = await fetch(url);
                const text = await response.text();
                
                // 解析谷歌特有的 JSON 包装
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);
                
                const rows = data.table.rows;
                let savingsLog = [];

                // 提取数据
                rows.forEach(row => {
                    if(row.c[0] && row.c[1]) {
                        savingsLog.push({
                            date: row.c[0].f || row.c[0].v,
                            amount: parseFloat(row.c[1].v)
                        });
                    }
                });

                updateTableUI(savingsLog);
            } catch (error) {
                console.error("Error loading data:", error);
                loadingData.innerText = "Failed to load data. Check configuration.";
            }
        }

        // 渲染表格 UI
        function updateTableUI(savingsLog) {
            // 按日期正序排序计算差值
            savingsLog.sort((a, b) => new Date(a.date) - new Date(b.date));
            tableBody.innerHTML = '';

            savingsLog.forEach((entry, index) => {
                const row = document.createElement('tr');
                let differenceText = '-';
                let diffClass = '';

                if (index > 0) {
                    const diff = entry.amount - savingsLog[index - 1].amount;
                    if (diff > 0) {
                        differenceText = `+$${diff.toFixed(2)}`;
                        diffClass = 'positive';
                    } else if (diff < 0) {
                        differenceText = `-$${Math.abs(diff).toFixed(2)}`;
                        diffClass = 'negative';
                    } else {
                        differenceText = `$0.00`;
                    }
                }

                row.innerHTML = `
                    <td>${entry.date}</td>
                    <td>$${entry.amount.toFixed(2)}</td>
                    <td class="${diffClass}">${differenceText}</td>
                `;
                tableBody.insertBefore(row, tableBody.firstChild); // 最新数据在最上方
            });

            loadingData.style.display = 'none';
            trackerTable.style.display = 'table';
        }

        // 提交数据到 SheetDB
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const date = document.getElementById('date').value;
            const amount = parseFloat(document.getElementById('amount').value);

            submitBtn.disabled = true;
            statusMessage.style.display = 'inline';
            statusMessage.innerText = 'Saving...';

            try {
                const response = await fetch(SHEETDB_API_URL, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: [{ "Date": date, "Amount": amount }]
                    })
                });

                if (response.ok) {
                    statusMessage.innerText = 'Saved successfully!';
                    document.getElementById('amount').value = '';
                    // 重新拉取最新数据
                    await fetchCloudData();
                } else {
                    statusMessage.innerText = 'Save failed. Try again.';
                }
            } catch (error) {
                console.error("Error saving data:", error);
                statusMessage.innerText = 'Network error.';
            } finally {
                submitBtn.disabled = false;
                setTimeout(() => { statusMessage.style.display = 'none'; }, 3000);
            }
        });

        // 页面加载时自动获取数据
        fetchCloudData();
    </script>
</body>
</html>
